server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # This is what makes the ALB's health check (path "/") succeed —
    # any request to "/" gets served index.html directly.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic gzip compression — a small, real-world optimization that
    # costs nothing to include and shows attention to detail.
    gzip on;
    gzip_types text/plain text/css application/javascript text/html;

    # Custom error page fallback (keeps things simple — no separate
    # error page file needed, Nginx just serves index.html)
    error_page 404 /index.html;
}